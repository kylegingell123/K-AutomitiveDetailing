<script>
const dateInput = document.getElementById("date");
const calendar = document.getElementById("booking-calendar");

const today = new Date();
today.setHours(0, 0, 0, 0);

const maxDate = new Date(today);
maxDate.setDate(maxDate.getDate() + 90);

let displayedMonth = new Date(
    today.getFullYear(),
    today.getMonth(),
    1
);

function formatDate(date) {
    return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
}

function isBooked(date) {
    const day = date.getDay();

    // College days
    if ([1, 3, 4].includes(day)) {
        return true;
    }

    // Alternating weekends, starting 21 November 2026
    const firstWeekend = new Date(2026, 10, 21);
    firstWeekend.setHours(0, 0, 0, 0);

    const difference = Math.round(
        (date - firstWeekend) / 86400000
    );

    if (difference >= 0 && difference % 14 < 2) {
        return true;
    }

    return false;
}

function renderCalendar() {
    calendar.innerHTML = "";

    const year = displayedMonth.getFullYear();
    const month = displayedMonth.getMonth();

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const header = document.createElement("div");
    header.className = "calendar-header";

    const previous = document.createElement("button");
    previous.type = "button";
    previous.textContent = "‹";

    previous.onclick = function() {
        displayedMonth.setMonth(displayedMonth.getMonth() - 1);
        renderCalendar();
    };

    const title = document.createElement("h3");
    title.textContent = displayedMonth.toLocaleDateString(
        "en-GB",
        { month: "long", year: "numeric" }
    );

    const next = document.createElement("button");
    next.type = "button";
    next.textContent = "›";

    next.onclick = function() {
        displayedMonth.setMonth(displayedMonth.getMonth() + 1);
        renderCalendar();
    };

    header.append(previous, title, next);
    calendar.appendChild(header);

    const grid = document.createElement("div");
    grid.className = "calendar-grid";

    ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
        .forEach(day => {
            const label = document.createElement("div");
            label.className = "calendar-day";
            label.textContent = day;
            grid.appendChild(label);
        });

    for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement("div"));
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateString = formatDate(date);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "calendar-date";

        const number = document.createElement("span");
        number.textContent = day;
        button.appendChild(number);

        const outsideRange = date < today || date > maxDate;
        const booked = isBooked(date);

        if (outsideRange || booked) {
            button.disabled = true;
        }

        if (booked && !outsideRange) {
            button.classList.add("booked");

            const label = document.createElement("small");
            label.textContent = "FULLY BOOKED";
            button.appendChild(label);
        }

        if (dateString === dateInput.value) {
            button.classList.add("selected");
        }

        if (!outsideRange && !booked) {
            button.onclick = function() {
                dateInput.value = dateString;
                renderCalendar();
            };
        }

        grid.appendChild(button);
    }

    calendar.appendChild(grid);

    const legend = document.createElement("p");
    legend.className = "calendar-legend";
    legend.textContent =
        "Available dates can be selected. Red dates are FULLY BOOKED.";

    calendar.appendChild(legend);
}

dateInput.addEventListener("click", renderCalendar);

// Initial calendar
renderCalendar();

document.getElementById("booking-form").addEventListener(
    "submit",
    function(event) {
        event.preventDefault();

        const selectedDate = new Date(dateInput.value + "T12:00:00");

        if (!dateInput.value || isBooked(selectedDate)) {
            alert("Please choose an available date.");
            return;
        }

        const bookingReference = "KAD-" +
            Date.now().toString().slice(-6) + "-" +
            Math.floor(100 + Math.random() * 900);

        const name = document.getElementById("name").value;
        const vehicle = document.getElementById("vehicle").value;
        const vehicleType = document.getElementById("vehicle-type").value;
        const registration = document.getElementById("registration").value;
        const address = document.getElementById("address").value;
        const service = document.getElementById("service").value;
        const date = dateInput.value;
        const time = document.getElementById("time").value;
        const message = document.getElementById("message").value;

        const bookingMessage =
            "Hi, I'd like to request a car detailing booking.\n\n" +
            "Booking Reference: " + bookingReference + "\n" +
            "Name: " + name + "\n" +
            "Vehicle: " + vehicle + "\n" +
            "Vehicle Type: " + vehicleType + "\n" +
            "Registration: " + registration + "\n" +
            "Vehicle Location: " + address + "\n" +
            "Service: " + service + "\n" +
            "Preferred Date: " + date + "\n" +
            "Preferred Time: " + time + "\n" +
            "Additional Information: " + message + "\n\n" +
            "Please remember to attach your vehicle photos if you have any.";

        const whatsappURL =
            "https://wa.me/447947602239?text=" +
            encodeURIComponent(bookingMessage);

        document.getElementById("booking-status").textContent =
            "Your enquiry reference is " + bookingReference +
            ". Please send the WhatsApp message to complete your enquiry.";

        window.open(whatsappURL, "_blank");
    }
);
</script>
